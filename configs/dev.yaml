# Development environment configuration
# Overrides are merged on top of defaults from Settings class.

app_env: dev
app_debug: true
use_mocks: false

logging:
  level: DEBUG
  format: console

server:
  host: "127.0.0.1"
  port: 8001
  reload: true
  workers: 1

llm:
  temperature: 0.3
  timeout_seconds: 60

embedding:
  dimension: 1152

database:
  enabled: true
  pool_size: 5
  echo: true

vector_store:
  backend: qdrant
  persist_dir: data/chroma
  collection_name: scin_embeddings
  top_k: 10
  qdrant_host: localhost
  qdrant_port: 6333
  qdrant_grpc_port: 6334
