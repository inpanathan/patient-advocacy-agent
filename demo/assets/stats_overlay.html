<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Impact Statistics</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #f8fafc; overflow: hidden;
  }
  h2 {
    font-size: 36px; font-weight: 600; margin-bottom: 60px; color: #94a3b8;
    text-transform: uppercase; letter-spacing: 3px;
  }
  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 48px; max-width: 1400px;
  }
  .stat {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px; padding: 48px 40px; text-align: center;
  }
  .stat .number {
    font-size: 64px; font-weight: 800; margin-bottom: 16px;
    background: linear-gradient(90deg, #f472b6, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .stat .label {
    font-size: 22px; color: #94a3b8; line-height: 1.4;
  }
  .row2 {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 48px; max-width: 960px; margin-top: 48px;
  }
  .highlight {
    border-color: rgba(34, 197, 94, 0.3) !important;
  }
  .highlight .number {
    background: linear-gradient(90deg, #4ade80, #2dd4bf);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
</style>
</head>
<body>
  <h2>Why This Matters</h2>
  <div class="stats">
    <div class="stat">
      <div class="number">1.8B</div>
      <div class="label">People affected by<br>skin conditions worldwide</div>
    </div>
    <div class="stat">
      <div class="number">&lt;1</div>
      <div class="label">Dermatologist per 1 million<br>in sub-Saharan Africa</div>
    </div>
    <div class="stat">
      <div class="number">600M+</div>
      <div class="label">Illiterate adults who<br>cannot use text-based apps</div>
    </div>
  </div>
  <div class="row2">
    <div class="stat highlight">
      <div class="number">&lt; 3 min</div>
      <div class="label">Time to complete triage<br>with voice-only interface</div>
    </div>
    <div class="stat highlight">
      <div class="number">5</div>
      <div class="label">Languages supported<br>Hindi, Bengali, Tamil, Swahili, Spanish</div>
    </div>
  </div>
</body>
</html>
