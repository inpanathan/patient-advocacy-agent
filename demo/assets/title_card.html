<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Patient Advocacy Agent</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #f8fafc; overflow: hidden;
  }
  .badge {
    background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.4);
    border-radius: 24px; padding: 8px 24px; font-size: 18px; color: #4ade80;
    letter-spacing: 2px; text-transform: uppercase; margin-bottom: 40px;
  }
  h1 {
    font-size: 72px; font-weight: 700; text-align: center;
    line-height: 1.15; margin-bottom: 24px;
    background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle {
    font-size: 32px; color: #94a3b8; text-align: center;
    max-width: 900px; line-height: 1.5; margin-bottom: 60px;
  }
  .models {
    display: flex; gap: 32px;
  }
  .model-badge {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 16px 32px; font-size: 20px; color: #cbd5e1;
  }
  .model-badge strong { color: #f8fafc; }
  .footer {
    position: absolute; bottom: 40px;
    font-size: 16px; color: #475569; letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="badge">MedGemma Impact Challenge</div>
  <h1>Patient Advocacy Agent</h1>
  <div class="subtitle">Voice-Only Dermatological Triage for the Global South</div>
  <div class="models">
    <div class="model-badge"><strong>MedGemma 4B</strong> &middot; QLoRA Fine-Tuned</div>
    <div class="model-badge"><strong>MedSigLIP-448</strong> &middot; Medical Image Encoder</div>
    <div class="model-badge"><strong>Qdrant</strong> &middot; Vector RAG</div>
  </div>
  <div class="footer">HAI-DEF &middot; Health AI Developer Foundations &middot; Google Research</div>
</body>
</html>
